[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-autoname"
version = "0.4.1"
description = "Automatically name Herdr workspaces, tabs, and panes from recent agent sessions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jiajun Chen" }]
keywords = ["herdr", "cli", "workspace", "agent", "naming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/thejiajun/herdr-autoname"
Repository = "https://github.com/thejiajun/herdr-autoname"
Issues = "https://github.com/thejiajun/herdr-autoname/issues"

[project.scripts]
herdr-autoname = "rename_workspaces:cli"

[tool.setuptools]
py-modules = ["rename_workspaces"]
package-dir = { "" = "scripts" }
